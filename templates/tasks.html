{% extends "base.html" %}

{% block title %}My Hobbies{% endblock %}
{% block content %}
    <h1>My Hobbies</h1>

    {% if hobbies %}
        <p>Total hobbies: {{ hobbies|length }}</p>
        <ul>
            {% for hobby in hobbies %}
                <li>{{ hobby|upper }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hobbies listed.</p>
    {% endif %}
{% endblock %}
